<h1>Practice Problems</h1>

<div class="search-section">

  <input
    type="text"
    placeholder="🔍 Search Question..."
    [(ngModel)]="searchText"
    (input)="filterQuestions()"
  />

  <select
    [(ngModel)]="selectedDifficulty"
    (change)="filterQuestions()"
  >
    <option value="">All Difficulties</option>
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
  </select>

</div>

<p>
  Questions loaded: {{ allQuestions.length }}
</p>

<div class="question-list">

  <div
    class="question-card"
    *ngFor="let question of filteredQuestions; let i = index"
  >

    <div class="question-header">

      <h2>{{ question.title }}</h2>

      <span
        class="difficulty"
        [ngClass]="question.difficulty?.toLowerCase()"
      >
        {{ question.difficulty }}
      </span>

    </div>

    <p class="description">
      {{ question.description }}
    </p>

    <div class="question-footer">

      <span class="language">
        💻 {{ question.language || 'JavaScript' }}
      </span>

      <button
        type="button"
        (click)="solveQuestion(i)"
      >
        Solve →
      </button>

    </div>

  </div>

</div>

<div
  *ngIf="filteredQuestions.length === 0 && allQuestions.length > 0"
>
  <h2>No questions match your search/filter.</h2>
</div>

<div
  *ngIf="allQuestions.length === 0"
>
  <h2>No questions found</h2>
</div>
