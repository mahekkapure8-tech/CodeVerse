<h1>Practice Problems</h1>

<!-- SEARCH + FILTER -->
<div class="search-section">

  <input
    type="text"
    placeholder="🔍 Search Question..."
    [(ngModel)]="searchText"
    (ngModelChange)="filterQuestions()"
  />

  <select
    [(ngModel)]="selectedDifficulty"
    (ngModelChange)="filterQuestions()"
  >
    <option value="">All Difficulties</option>
    <option value="Easy">Easy</option>
    <option value="Medium">Medium</option>
    <option value="Hard">Hard</option>
  </select>

</div>

<!-- LOADING -->
<div *ngIf="loading" class="loading">
  <h2>Loading questions...</h2>
</div>

<!-- CONTENT -->
<ng-container *ngIf="!loading">

  <p>
    Questions loaded: {{ filteredQuestions.length }}
  </p>

  <!-- NO QUESTIONS -->
  <div *ngIf="filteredQuestions.length === 0">
    <h2>No questions found</h2>
  </div>

  <!-- QUESTIONS -->
  <div
    class="question-list"
    *ngIf="filteredQuestions.length > 0"
  >

    <div
      class="question-card"
      *ngFor="let question of filteredQuestions; trackBy: trackByQuestionId"
    >

      <div class="question-header">

        <h2>
          {{ question.title }}
        </h2>

        <span
          class="difficulty"
          [ngClass]="question.difficulty?.toLowerCase()"
        >
          {{ question.difficulty }}
        </span>

      </div>

      <p class="description">
        {{ question.description }}
      </p>

      <div class="question-footer">

        <span class="language">
          💻 {{ question.language }}
        </span>

        <button
          type="button"
          (click)="solveQuestionById(question._id)"
        >
          Solve →
        </button>

      </div>

    </div>

  </div>

</ng-container>
