<div class="question-page">

  <!-- Question Header -->
  <div class="question-card">
    <div class="question-top">
      <div>
        <h1>{{ title() }}</h1>

        <p class="description">
          {{ description() }}
        </p>
      </div>

      <span
        class="difficulty"
        [ngClass]="difficulty().toLowerCase()"
      >
        {{ difficulty() }}
      </span>
    </div>

    <div class="language">
      💻 Language: <b>{{ language() }}</b>
    </div>
  </div>

  <!-- Starter Code -->
  <div class="editor-card">
    <h2>Starter Code</h2>
    <pre class="code-box">{{ starterCode() }}</pre>
  </div>

  <!-- Code Editor -->
  <div class="editor-card">
    <h2>Your Code</h2>

    <textarea
      [(ngModel)]="code"
      rows="14"
      placeholder="Write your solution here..."
    ></textarea>

    <div class="buttons">

      <button
        class="run-btn"
        type="button"
        (click)="runCode()"
      >
        ▶ Run Code
      </button>

      <button
        class="submit-btn"
        type="button"
        (click)="submitCode()"
        [disabled]="!allPassed"
      >
        ✓ Submit Code
      </button>

    </div>
  </div>

  <!-- Success -->
  <div
    class="success-message"
    *ngIf="allPassed"
  >
    🎉 All test cases passed! You can submit your solution.
  </div>

  <!-- Output - ONLY ONCE -->
  <div class="editor-card">
    <h2>Output</h2>

    <pre class="output-box">{{ output }}</pre>
  </div>
